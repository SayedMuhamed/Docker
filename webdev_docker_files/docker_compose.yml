version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../backend.Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DB_URL=mongodb://database:27017/myapp
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: ../frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  database:
    image: mongo:latest
    volumes:
      - db-data:/data/db

volumes:
  db-data: